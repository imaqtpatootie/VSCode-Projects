<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNHS Student Portal - Dashboard</title>
    <link rel="icon" href="../imgs/my-icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/modern-styles.css">
    <link rel="stylesheet" href="./assets/css/portal-styles.css">
    <link rel="stylesheet" href="./assets/css/modern-enhancements.css">
    <link rel="stylesheet" href="./assets/css/dashboard.css">
    <link rel="stylesheet" href="./assets/css/activities.css">
    <link rel="stylesheet" href="./assets/css/forum.css">
    <link rel="stylesheet" href="./assets/css/voting.css">
    <link rel="stylesheet" href="./assets/css/profile.css">
    <link rel="stylesheet" href="./assets/css/accessibility.css">
</head>

<body>


    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="school-logo">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
            </div>
            <h2>SNHS Portal</h2>
            <div class="loading-spinner"></div>
            <p>Loading your dashboard...</p>
        </div>
    </div>

    <!-- Main Portal Container -->
    <div id="portalContainer" class="portal-container" style="display: none;">
        <!-- Portal Header -->
        <header class="portal-header">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation menu"
                    aria-expanded="false" aria-controls="portalSidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <div class="portal-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    <span>SNHS Portal</span>
                </div>
            </div>

            <!-- Desktop Navigation in Header -->
            <nav class="header-nav" role="navigation" aria-label="Portal navigation">
                <ul class="nav-menu" role="menubar" aria-label="Main navigation">
                    <li role="none">
                        <a href="#" class="nav-item active" data-section="dashboard" role="menuitem"
                            aria-current="page" aria-label="Dashboard">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="7" height="9" x="3" y="3" rx="1"/>
                                <rect width="7" height="5" x="14" y="3" rx="1"/>
                                <rect width="7" height="9" x="14" y="12" rx="1"/>
                                <rect width="7" height="5" x="3" y="16" rx="1"/>
                            </svg>
                        </a>
                    </li>
                    <li role="none">
                        <a href="#" class="nav-item" data-section="activities" role="menuitem" aria-label="Activities and Exams">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14,2 14,8 20,8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                                <polyline points="10,9 9,9 8,9"/>
                            </svg>
                        </a>
                    </li>
                    <li role="none">
                        <a href="#" class="nav-item" data-section="forum" role="menuitem" aria-label="Community Forum">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                <path d="M8 10h.01"/>
                                <path d="M12 10h.01"/>
                                <path d="M16 10h.01"/>
                            </svg>
                        </a>
                    </li>
                    <li role="none">
                        <a href="#" class="nav-item" data-section="voting" role="menuitem" aria-label="Elections and Polls">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 11H5a2 2 0 0 0-2 2v7c0 1.1.9 2 2 2h4m4-9h4a2 2 0 0 1 2 2v7c0 1.1-.9 2-2 2h-4m-4-9v9m0-9l3-3m-3 3l-3-3"/>
                            </svg>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="header-right">
                <div class="notifications">
                    <button class="notification-btn" id="notificationBtn" aria-label="View notifications"
                        aria-describedby="notificationCount">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <span class="notification-count" id="notificationCount"
                            aria-label="unread notifications">0</span>
                    </button>
                    
                    <!-- Notification Dropdown -->
                    <div class="notification-dropdown" id="notificationDropdown" role="menu" aria-labelledby="notificationBtn">
                        <div class="notification-dropdown-header">
                            <h3>Notifications</h3>
                        </div>
                        <div class="notification-dropdown-content" id="notificationContent">
                            <div class="loading-notifications">Loading notifications...</div>
                        </div>
                        <div class="notification-dropdown-footer">
                            <button class="btn-text" onclick="ComponentRouter.navigateTo('notifications')">View All</button>
                        </div>
                    </div>
                </div>
                <div class="user-menu">
                    <button class="user-menu-btn" id="userMenuBtn" aria-label="User menu" aria-expanded="false"
                        aria-haspopup="true" aria-controls="userDropdown">
                        <div class="user-avatar" aria-hidden="true">
                            <span id="userInitials">JD</span>
                        </div>
                        <span id="userName">Juan Dela Cruz</span>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    <div class="user-dropdown" id="userDropdown" role="menu" aria-labelledby="userMenuBtn">
                        <a href="#" class="dropdown-item" data-section="profile" role="menuitem">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            My Profile
                        </a>
                        <a href="../index.html" class="dropdown-item" role="menuitem">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                            </svg>
                            Back to Website
                        </a>
                        <div class="dropdown-divider" role="separator"></div>
                        <a href="#" class="dropdown-item" id="logoutBtn" role="menuitem">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                            Logout
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Mobile Overlay -->
        <div class="mobile-overlay" id="mobileOverlay"></div>

        <!-- Portal Layout -->
        <div class="portal-layout">
            <!-- Mobile Sidebar Navigation (hidden on desktop) -->
            <nav class="portal-sidebar" id="portalSidebar" role="navigation" aria-label="Mobile navigation">
                <div class="sidebar-content">
                    <ul class="nav-menu" role="menubar" aria-label="Main navigation">
                        <li role="none">
                            <a href="#" class="nav-item active" data-section="dashboard" role="menuitem"
                                aria-current="page">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 5a2 2 0 012-2h4a2 2 0 012 2v0M8 11h.01M12 11h.01M16 11h.01" />
                                </svg>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li role="none">
                            <a href="#" class="nav-item" data-section="activities" role="menuitem">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14,2 14,8 20,8"/>
                                    <line x1="16" y1="13" x2="8" y2="13"/>
                                    <line x1="16" y1="17" x2="8" y2="17"/>
                                    <polyline points="10,9 9,9 8,9"/>
                                </svg>
                                <span>Activities & Exams</span>
                                <span class="nav-badge" id="activitiesBadgeMobile" aria-label="new activities">0</span>
                            </a>
                        </li>
                        <li role="none">
                            <a href="#" class="nav-item" data-section="forum" role="menuitem">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a2 2 0 01-2-2v-6a2 2 0 012-2h8z" />
                                </svg>
                                <span>Community Forum</span>
                                <span class="nav-badge" id="forumBadgeMobile" aria-label="unread forum posts">0</span>
                            </a>
                        </li>
                        <li role="none">
                            <a href="#" class="nav-item" data-section="voting" role="menuitem">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                                </svg>
                                <span>Elections & Polls</span>
                                <span class="nav-badge" id="votingBadgeMobile"
                                    aria-label="new voting opportunities">0</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="portal-main" role="main" aria-label="Main content">
                <div id="contentArea" class="content-area">
                    <!-- Content will be dynamically loaded here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script src="./assets/js/utils.js"></script>
    <script src="./assets/js/accessibility.js"></script>
    <script src="./assets/js/activities.js"></script>
    <script src="./assets/js/components/activity-validators.js"></script>
    <script src="./assets/js/components/activity-manager.js"></script>
    <script src="./assets/js/components/question-builder.js"></script>
    <script src="./assets/js/components/question-renderer.js"></script>
    <script src="./assets/js/components/response-manager.js"></script>
    <script src="./assets/js/components/activities-interface.js"></script>
    <script src="./assets/js/components/activity-creation-wizard.js"></script>
    <script src="./assets/js/components/grading-interface.js"></script>
    <script src="./assets/js/components/activity-taking-interface.js"></script>
    <script src="./assets/js/components/results-viewer.js"></script>
    <script src="./assets/js/test-session.js"></script>
    <script src="./assets/js/debug-activities.js"></script>
    <script src="./assets/js/test-activity-interaction.js"></script>
    <script src="./assets/js/interaction-fix.js"></script>
    <script src="./assets/js/final-interaction-test.js"></script>
    <script src="./assets/js/activities-display-fix.js"></script>
    <script src="./assets/js/selection-highlight-fix.js"></script>
    <script src="./assets/js/profile-image-test.js"></script>
    <script src="./assets/js/sample-activities-data.js"></script>
    <script src="./assets/js/dashboard.js"></script>
    <script src="./assets/js/forum.js"></script>
    <script src="./assets/js/voting.js"></script>
    <script src="./assets/js/profile.js"></script>
    <script src="./assets/js/portal-main.js"></script>
</body>

</html>

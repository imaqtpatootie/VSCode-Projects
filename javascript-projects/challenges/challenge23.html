<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge #23 - .innerHTML</title>
</head>
<body>
    <div id="container"></div>
    <script>
        const containerEl = document.getElementById("container")
        containerEl.innerHTML = "<button onclick='buyBtn()'>Buy Me</button>"
        function buyBtn(){
            // containerEl.innerHTML += "<br><p>Thank you for buying</p>"
            const p = document.createElement("p")
            p.textContent = "Thank you for buying"
            containerEl.append(p)
        }
        console.log("hi")
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <section class="output">
            <input type="number" id="output" placeholder="0">
        </section>
        <div class="row1">
            <button onclick="reset()">C</button>
            <button></button>
            <button>&LeftArrow;</button>
            <button>&divide;</button>
        </div>
        <div class="row2">
            <button onclick="saveNumber(7)">7</button>
            <button onclick="saveNumber(8)">8</button>
            <button onclick="saveNumber(9)">9</button>
            <button>&times;</button>
        </div>
        <div class="row3">
            <button onclick="saveNumber(4)">4</button>
            <button onclick="saveNumber(5)">5</button>
            <button onclick="saveNumber(6)">6</button>
            <button>&minus;</button>
        </div>
        <div class="row4">
            <button onclick="saveNumber(1)">1</button>
            <button onclick="saveNumber(2)">2</button>
            <button onclick="saveNumber(3)">3</button>
            <button>&plus;</button>
        </div>
        <div class="row5">
            <button></button>
            <button onclick="saveNumber(0)">0</button>
            <button>.</button>
            <button id="equals">=</button>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
